<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClickFix Warden</title>
    <link rel="stylesheet" href="../../src/ui/page.css" />
    <style>
      body { min-height: 100vh; display: flex; flex-direction: column; padding: 40px 48px; }
      main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 0; }
      .panel { width: 660px; max-width: 100%; display: flex; flex-direction: column; gap: 16px; }
      .panel .g-iconbox { width: 56px; height: 56px; border-radius: 14px; }
      .panel .g-label { font-size: 16px; }
      .panel h1 { margin: 0; font-size: 38px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; color: var(--red); }
      .lead { margin: 0; font-size: 16px; line-height: 1.65; color: var(--text2); }
      .facts { margin-top: 8px; border-top: 1px solid var(--line); }
      .facts .row { display: flex; gap: 16px; padding: 12px 0; font-size: 14px; border-bottom: 1px solid var(--line); align-items: center; }
      .facts .key { width: 120px; flex: none; color: var(--muted); }
      .facts .val { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .actions { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
      .actions .spacer { flex: 1; }
      .open { background: none; border: none; padding: 12px 4px; color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer; }
      .advice { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
      @media (max-width: 560px) { body { padding: 24px 16px; } .panel h1 { font-size: 30px; } .facts .key { width: 96px; } }
    </style>
  </head>
  <body>
    <a class="brand" href="#"><img src="/icon/48.png" alt="" /><span>ClickFix Warden</span></a>
    <main>
      <div class="panel">
        <div class="g-head"><div class="g-iconbox" id="iconbox"></div><div class="g-label" data-i18n="dangerLabel">POTENTIALLY DANGEROUS SITE</div></div>
        <h1 data-i18n="warnTitle">Dangerous site blocked</h1>
        <p class="lead" id="lead"></p>
        <div class="facts">
          <div class="row"><span class="key" data-i18n="warnAddress">Address</span><span class="val" id="url"></span></div>
          <div class="row" id="reports"></div>
        </div>
        <div class="actions">
          <button class="g-btn primary" id="leave" data-i18n="warnLeave" data-i18n-title="warnLeaveTip">Back to safety</button>
          <span class="spacer"></span>
          <button class="open" id="continue" data-i18n="warnContinue" data-i18n-title="warnContinueTip">Open anyway</button>
        </div>
        <p class="advice" data-i18n="warnAdvice">No real website asks you to paste anything into Run, Terminal or File Explorer.</p>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
