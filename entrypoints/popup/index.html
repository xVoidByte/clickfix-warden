<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClickFix Warden</title>
    <link rel="stylesheet" href="../../src/ui/page.css" />
    <style>
      body { width: 360px; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
      section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .host { font-weight: 600; word-break: break-all; }
      .status { margin: 6px 0 8px; }
      .reports { font-size: 12.5px; margin: 6px 0 0; padding-left: 18px; }
      .recent { list-style: none; margin: 6px 0 0; padding: 0; }
      .recent li { padding: 6px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
      .recent li:first-child { border-top: none; }
      footer { display: flex; flex-wrap: wrap; gap: 14px; padding: 12px 16px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-bottom: 4px; }
      .off { background: var(--warn-bg); padding: 8px 16px; font-size: 12.5px; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><img src="/icon/48.png" alt="" /><span class="name">ClickFix Warden</span></div>
      <label class="row">
        <span class="switch"><input type="checkbox" id="enabled" /><span class="track"></span></span>
        <span class="tip" tabindex="0" data-i18n-tip="tipEnabled">i</span>
      </label>
    </header>
    <div class="off" id="offNote" hidden data-i18n="popupOff">Protection is turned off.</div>
    <section>
      <h2 data-i18n="popupThisSite">This site</h2>
      <div class="host" id="host"></div>
      <div class="status" id="status"></div>
      <ul class="reports" id="reports" hidden></ul>
      <button class="link" id="trust"></button>
    </section>
    <section>
      <h2 data-i18n="popupProtection">Protection</h2>
      <div class="row small">
        <span id="feedLine"></span>
        <button class="link" id="update" data-i18n="popupUpdate" data-i18n-title="tipUpdateNow">Update now</button>
      </div>
      <div class="small muted" id="rulesLine"></div>
    </section>
    <section>
      <h2 data-i18n="popupRecent">Recent detections</h2>
      <ul class="recent" id="recent"></ul>
    </section>
    <footer>
      <a href="#" id="openOptions" data-i18n="popupSettings">Settings</a>
      <a href="#" id="openHistory" data-i18n="popupHistory">Check my history</a>
      <a href="#" id="donate" hidden data-i18n="supportProject">Support the project</a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
