<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClickFix Warden</title>
    <link rel="stylesheet" href="../../src/ui/page.css" />
    <style>
      body { width: 360px; background: var(--surface); }
      header { padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; }
      header .name { font-size: 16px; font-weight: 700; }
      .onoff { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
      .onoff input { width: 18px; height: 18px; margin: 0; accent-color: #F3F3F4; }
      .off { margin: 0 12px 10px; padding: 10px 14px; border-radius: 12px; background: var(--redbg); color: #FFFFFF; font-size: 14px; }
      .site { margin: 0 12px; padding: 14px; border-radius: 12px; background: var(--raised); }
      .site .host { font-size: 15px; font-weight: 600; word-break: break-all; }
      .site .status { margin-top: 4px; font-size: 14px; color: var(--text2); }
      .site .status strong.red { color: var(--red); }
      .site .trust { margin-top: 8px; background: none; border: none; padding: 0; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }
      .stats { padding: 16px 18px; font-size: 14px; line-height: 1.65; color: var(--text2); }
      .recent { padding: 0 18px 8px; font-size: 14px; color: var(--text2); }
      .recent .item { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
      .recent .item span:last-child { color: var(--muted); white-space: nowrap; }
      footer { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 18px; font-size: 14px; font-weight: 600; }
      footer { flex-wrap: wrap; row-gap: 10px; }
      footer a { white-space: nowrap; }
      footer .support { margin-inline-start: auto; }
      .g-backdrop { position: fixed; }
      body .g-card, body .g-card.wide { width: 340px; padding: 20px; }
      .g-title { font-size: 20px; }
      .g-title.white { font-size: 19px; }
      .g-label { font-size: 12px; }
      .g-text { font-size: 14px; }
    </style>
  </head>
  <body>
    <header>
      <span class="name">ClickFix Warden</span>
      <label class="onoff" data-i18n-title="tipEnabled"><input type="checkbox" id="enabled" /> <span data-i18n="popupOn">On</span></label>
    </header>
    <div class="off" id="offNote" hidden data-i18n="popupOff">Protection is turned off.</div>
    <div class="site">
      <div class="host" id="host"></div>
      <div class="status" id="status"></div>
      <button class="trust" id="trust" hidden></button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="recent" id="recent"></div>
    <footer>
      <a href="#" id="openOptions" data-i18n="popupSettings">Settings</a>
      <a href="#" id="openHistory" data-i18n="popupHistory">Check my history</a>
      <a href="#" class="support small" id="donate" hidden data-i18n-title="tipSupport">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 C12 21 3 15.2 3 8.9 C3 6.2 5.1 4 7.7 4 C9.5 4 11.1 5 12 6.5 C12.9 5 14.5 4 16.3 4 C18.9 4 21 6.2 21 8.9 C21 15.2 12 21 12 21 Z" fill="#FF5C5C"></path></svg>
        <span data-i18n="supportShort">Support</span>
      </a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
