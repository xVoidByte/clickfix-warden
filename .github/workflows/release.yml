name: Release

# A v* tag builds the store packages and attaches them with their SHA-256 hashes to a GitHub release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Build the store packages
        run: npm run zip
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            .output/*.zip
            .output/SHA256SUMS.txt
          generate_release_notes: true
      # The same zips go to every store whose keys are saved as secrets, the first upload to a store is always by hand.
      - name: Send the packages to the stores
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          v=$(node -p "require('./package.json').version")
          args=()
          if [ -n "$CHROME_EXTENSION_ID" ] && [ -n "$CHROME_REFRESH_TOKEN" ]; then args+=(--chrome-zip ".output/clickfix-warden-$v-chrome.zip"); fi
          if [ -n "$FIREFOX_EXTENSION_ID" ] && [ -n "$FIREFOX_JWT_SECRET" ]; then args+=(--firefox-zip ".output/clickfix-warden-$v-firefox.zip" --firefox-sources-zip ".output/clickfix-warden-$v-sources.zip"); fi
          if [ -n "$EDGE_PRODUCT_ID" ] && [ -n "$EDGE_API_KEY" ]; then args+=(--edge-zip ".output/clickfix-warden-$v-edge.zip"); fi
          if [ ${#args[@]} -eq 0 ]; then echo "::notice::No store keys are saved yet, upload the zips from this release by hand."; exit 0; fi
          npx wxt submit "${args[@]}"
