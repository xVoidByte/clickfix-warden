name: Publish database

# Rebuilds and publishes the signed database every hour, a failed run publishes nothing and missing secrets only leave a notice.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rules/**
      - feed-builder/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Check that the secrets are set
        id: secrets
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: |
          if [ -z "$ABUSECH_AUTH_KEY" ] || [ -z "$FEED_SIGNING_KEY" ]; then
            echo "::notice::ABUSECH_AUTH_KEY or FEED_SIGNING_KEY is not set, nothing was published"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - name: Build and sign the database
        if: steps.secrets.outputs.ready == 'true'
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: npm run feed:build
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
