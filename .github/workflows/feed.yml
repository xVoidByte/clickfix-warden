name: Publish database

# Rebuilds and publishes the signed database every hour with a backup slot, a failed run publishes nothing and missing secrets only leave a notice.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rules/**
      - feed-builder/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      # The :37 slot only publishes when GitHub skipped the :07 one, so browsers stay one step behind and keep getting the small delta.
      - name: Check the secrets and the age of the live database
        id: secrets
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$ABUSECH_AUTH_KEY" ] || [ -z "$FEED_SIGNING_KEY" ]; then
            echo "::notice::ABUSECH_AUTH_KEY or FEED_SIGNING_KEY is not set, nothing was published"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "schedule" ]; then
            generated=$(curl -fsS https://xvoidbyte.github.io/ClickFixWarden/v1/meta.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["generated"])' || true)
            if [ -n "$generated" ] && [ $(( $(date +%s) - $(date -d "$generated" +%s) )) -lt 2700 ]; then
              echo "::notice::The live database from $generated is less than 45 minutes old, nothing was published"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - name: Build and sign the database
        if: steps.secrets.outputs.ready == 'true'
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: npm run feed:build
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
